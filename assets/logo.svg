  </g>
  <!-- FERRON text -->
  <text x="36" y="27.5" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#f1f5f9">FERRON</text>
