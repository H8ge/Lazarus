<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 32" fill="none">
  <!-- Logo mark: Abstract F shaped like a steel I-beam cross-section -->
  <g>
    <!-- Top flange -->
    <rect x="0" y="2" width="24" height="5" rx="1" fill="#3b82f6"/>
    <!-- Web -->
    <rect x="0" y="7" width="5" height="18" rx="0.5" fill="#3b82f6"/>
    <!-- Middle flange -->
    <rect x="0" y="13" width="18" height="4.5" rx="1" fill="#60a5fa"/>
    <!-- Bottom -->
    <rect x="0" y="25" width="5" height="5" rx="0.5" fill="#3b82f6"/>
  </g>
  <!-- FERRON text -->
  <text x="34" y="25" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#f1f5f9">
    FERRON
  </text>
</svg>
