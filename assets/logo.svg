<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 36" fill="none">
  <!-- Logo mark: Abstract extrusion profile / F shape -->
  <g>
    <!-- Top flange -->
    <rect x="0" y="2" width="26" height="5.5" rx="1.2" fill="#3b82f6"/>
    <!-- Web -->
    <rect x="0" y="7.5" width="5.5" height="21" rx="0.6" fill="#3b82f6"/>
    <!-- Middle flange -->
