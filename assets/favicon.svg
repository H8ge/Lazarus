  <g transform="translate(6, 4)">
    <!-- Top chevron -->
    <path d="M2,6 L10,1 L18,6 L18,9 L10,4 L2,9 Z" fill="#ffffff"/>
    <!-- Red accent middle -->
    <path d="M5,11 L10,8 L15,11" fill="none" stroke="#c8102e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bottom chevron -->
